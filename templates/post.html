{% extends "_page.html" %}

{% block content %}
<article>
  <header>
    <h1>
      {{ page.title }}
    </h1>

    <div class="subheader">
      <span class="badge">Informational</span>
      <span>&#47;&#47;</span>
      <time>{{ page.date }}</time>
      <span>&#47;&#47;</span>
      <span><a href="{{ current_url }}">Permalink</a></span>
    </div>
  </header>

  {{ page.content | safe }}
</article>
{% endblock content %}
