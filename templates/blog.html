{% extends "_page.html" %}

{% block content %}
<h1>{{ section.title }}</h1>

<ul>
  {% for post in section.pages %}
    {% if post.extra.featured %}
    {% set article_class = "featured" %}
    {% else %}
    {% set article_class = "regular" %}
    {% endif %}

    <li class="{{ article_class }}"><a href="{{ post.path | safe }}">{{ post.title }}</a>
  {% endfor %}
</ul>

{% endblock content %}
